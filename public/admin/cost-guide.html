<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>여행 플래너 비용 관리</title>
<style>
  :root { --bg: #f6f8f8; --fg: #17252a; --muted: #5a6b70; --line: #d9e2e3; --accent: #0f6e6a; --err: #b4481f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1719; --fg: #e3ecec; --muted: #93a6a9; --line: #273739; --accent: #5cc4bc; --err: #f08c63; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Apple SD Gothic Neo", sans-serif; padding: 48px max(16px, env(safe-area-inset-left)); }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 200px; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); }
  button { font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #msg { color: var(--err); min-height: 1.6em; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <a href="/admin.html">← 사용량 페이지로</a>
  <h1>비용 관리 가이드</h1>
  <p>관리자 전용 문서입니다. 사용량 페이지와 같은 ADMIN_TOKEN을 입력하세요.</p>
  <form id="f">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password" required />
    <button>열기</button>
  </form>
  <div id="msg" role="status"></div>
</main>
<script>
// 문서 내용은 이 파일(공개 저장소)에 없고, 토큰을 확인한 서버가 Redis에서 꺼내 줍니다.
const $ = (s) => document.querySelector(s);
try { $("#token").value = sessionStorage.getItem("tm-admin") || ""; } catch {}
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = $("#token").value.trim();
  try { sessionStorage.setItem("tm-admin", token); } catch {}
  $("#msg").textContent = "불러오는 중…";
  try {
    const res = await fetch("/api/admin/docs/cost-guide", { headers: { Authorization: `Bearer ${token}` }, cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `오류 ${res.status}`);
    document.open();
    document.write(data.html);
    document.close();
  } catch (err) {
    $("#msg").textContent = err.message;
  }
});
if ($("#token").value) $("#f").requestSubmit();
</script>
</body>
</html>
