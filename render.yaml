services:
  - type: web
    name: travel-planner
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # Render 대시보드에서 직접 입력
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: DAILY_LIMIT
        value: "300"
